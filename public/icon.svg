<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Coin dropping -->
  <g filter="url(#shadow)">
    <!-- Golden Coin -->
    <circle cx="256" cy="175" r="75" fill="url(#coinGrad)" stroke="#fef3c7" stroke-width="6" />
    <circle cx="256" cy="175" r="58" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6,4" />
    <!-- Coin text "Rp" -->
    <text x="256" y="188" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#78350f" text-anchor="middle">Rp</text>
  </g>

  <!-- Jimpitan Box / Celengan -->
  <g filter="url(#shadow)">
    <rect x="126" y="240" width="260" height="175" rx="36" fill="url(#boxGrad)" stroke="#34d399" stroke-width="4" />
    <!-- Slot lubang celengan -->
    <rect x="206" y="260" width="100" height="14" rx="7" fill="#064e3b" />
    <!-- Text "RT 23" inside box -->
    <text x="256" y="348" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">RT 23</text>
    <text x="256" y="382" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">JIMPITAN</text>
  </g>
</svg>
